<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유튜브 트렌딩 수집기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
    background: #0f0f0f; color: #e8e8e8; min-height: 100vh;
  }
  a { text-decoration: none; color: inherit; }

  /* Header */
  .header {
    padding: 32px 24px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .header-tag { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .header-tag .badge {
    font-size: 13px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: #ff4444;
  }
  .header-tag .sub { font-size: 12px; color: rgba(255,255,255,0.3); font-weight: 500; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.02em; }
  .desc { font-size: 13px; color: rgba(255,255,255,0.4); }

  /* Controls */
  .controls { padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
  .input-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .input-row input {
    flex: 1 1 200px; padding: 10px 14px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
    color: #fff; font-size: 14px; outline: none; min-width: 0;
  }
  .input-row input:focus { border-color: rgba(255,68,68,0.4); }
  .btn-fetch {
    padding: 10px 20px; border-radius: 8px; border: none;
    background: #ff4444; color: #fff; font-size: 14px;
    font-weight: 600; cursor: pointer; white-space: nowrap; transition: background 0.15s;
  }
  .btn-fetch:hover { background: #e83a3a; }
  .btn-fetch:disabled { background: rgba(255,68,68,0.3); cursor: wait; }

  /* Tabs */
  .tabs { display: flex; gap: 0; }
  .tab {
    flex: 1; padding: 10px 0; text-align: center;
    font-size: 13px; font-weight: 600; cursor: pointer;
    border-bottom: 2px solid transparent;
    color: rgba(255,255,255,0.35); transition: all 0.2s;
    background: none; border-top: none; border-left: none; border-right: none;
  }
  .tab:hover { color: rgba(255,255,255,0.6); }
  .tab.active { color: #ff4444; border-bottom-color: #ff4444; }

  /* Filter rows */
  .filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    padding: 5px 12px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03);
    color: rgba(255,255,255,0.5); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.15s;
  }
  .pill.active {
    border-color: rgba(255,68,68,0.5); background: rgba(255,68,68,0.12); color: #ff6666;
  }

  /* Search-specific filters */
  .search-filters { display: none; flex-direction: column; gap: 10px; }
  .search-filters.visible { display: flex; }
  .search-input-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .search-input-row input {
    flex: 1 1 160px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
    color: #fff; font-size: 13px; outline: none; min-width: 0;
  }
  .search-input-row input:focus { border-color: rgba(255,68,68,0.4); }
  .filter-label {
    font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.3);
    text-transform: uppercase; letter-spacing: 0.06em;
  }

  /* Shared */
  .error-box {
    margin: 0 24px 16px; padding: 12px 16px; border-radius: 8px;
    background: rgba(255,68,68,0.08); border: 1px solid rgba(255,68,68,0.15);
    color: #ff8888; font-size: 13px;
  }
  .count-label {
    padding: 0 24px 12px; font-size: 12px;
    color: rgba(255,255,255,0.3); font-weight: 500;
  }
  .list { padding: 0 24px 40px; }
  .item {
    display: flex; gap: 14px; padding: 14px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04); align-items: flex-start;
  }
  .item:hover { background: rgba(255,255,255,0.02); border-radius: 8px; }
  .rank {
    width: 24px; flex-shrink: 0; font-size: 15px; font-weight: 700;
    color: rgba(255,255,255,0.2); text-align: right; padding-top: 8px;
    font-feature-settings: 'tnum';
  }
  .rank.top { color: #ff4444; }
  .thumb {
    width: 140px; flex-shrink: 0; aspect-ratio: 16/9; border-radius: 6px;
    overflow: hidden; background: rgba(255,255,255,0.05); position: relative;
  }
  .thumb.vertical { width: 80px; aspect-ratio: 9/16; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info {
    flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding-top: 2px;
  }
  .title {
    font-size: 14px; font-weight: 600; line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .channel { font-size: 12px; color: rgba(255,255,255,0.4); font-weight: 500; }
  .stats {
    display: flex; gap: 12px; font-size: 12px;
    color: rgba(255,255,255,0.3); font-weight: 400; margin-top: 2px;
  }
  .badge-row { display: flex; gap: 6px; margin-top: 2px; }
  .dur-badge {
    font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px;
    background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5);
    font-feature-settings: 'tnum';
  }
  .dur-badge.shorts { background: rgba(255,68,68,0.15); color: #ff6666; }
  .empty {
    text-align: center; padding: 60px 24px;
    color: rgba(255,255,255,0.2); font-size: 13px; line-height: 1.8;
  }
  .api-note {
    margin: 0 24px 16px; padding: 10px 14px; border-radius: 8px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    font-size: 11px; color: rgba(255,255,255,0.35); line-height: 1.6;
  }
  .api-note code {
    background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 3px;
    font-family: monospace; font-size: 11px;
  }

  @media (max-width: 500px) {
    .thumb { width: 110px; }
    .thumb.vertical { width: 64px; }
    h1 { font-size: 19px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-tag">
    <span class="badge">▶ TRENDING</span>
    <span class="sub">YouTube KR</span>
  </div>
  <h1>유튜브 트렌딩 수집기</h1>
  <p class="desc">인기 급상승 + 쇼츠 탐색 (Search API)</p>
</div>

<div class="controls">
  <div class="input-row">
    <input type="password" id="apiKey" placeholder="YouTube API 키 입력">
    <button class="btn-fetch" id="fetchBtn" onclick="doFetch()">수집하기</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-mode="popular" onclick="switchMode('popular')">
      🔥 인기 급상승
    </button>
    <button class="tab" data-mode="shorts" onclick="switchMode('shorts')">
      ⚡ 쇼츠 탐색
    </button>
  </div>

  <!-- 인기 급상승 필터 -->
  <div id="popularFilters" class="filter-row">
    <div class="pills" id="catPills"></div>
  </div>

  <!-- 쇼츠 탐색 필터 -->
  <div id="shortsFilters" class="search-filters">
    <div class="search-input-row">
      <input type="text" id="searchQuery" placeholder="검색 키워드 (비우면 전체)">
    </div>
    <div>
      <div class="filter-label" style="margin-bottom:6px">기간</div>
      <div class="pills" id="timePills"></div>
    </div>
    <div>
      <div class="filter-label" style="margin-bottom:6px">정렬</div>
      <div class="pills" id="orderPills"></div>
    </div>
  </div>
</div>

<div id="errorBox" class="error-box" style="display:none"></div>
<div id="apiNote" class="api-note" style="display:none"></div>
<div id="countLabel" class="count-label" style="display:none"></div>
<div class="list" id="list"></div>
<div id="emptyState" class="empty">
  API 키를 입력하고 "수집하기"를 누르세요.<br>
  🔥 인기 급상승: mostPopular 엔드포인트<br>
  ⚡ 쇼츠 탐색: search + videos 엔드포인트 조합
</div>

<script>
// ─── State ───
let mode = "popular";
let selectedCat = "0";
let selectedTime = "24h";
let selectedOrder = "viewCount";

// ─── Config ───
const CATEGORIES = [
  { id: "0", label: "전체" },
  { id: "10", label: "음악" },
  { id: "24", label: "엔터" },
  { id: "20", label: "게임" },
  { id: "22", label: "브이로그" },
  { id: "25", label: "뉴스" },
  { id: "28", label: "과학기술" },
];
const TIME_RANGES = [
  { id: "6h",  label: "6시간" },
  { id: "24h", label: "24시간" },
  { id: "48h", label: "48시간" },
  { id: "7d",  label: "7일" },
];
const ORDERS = [
  { id: "viewCount", label: "조회수순" },
  { id: "date",      label: "최신순" },
  { id: "relevance", label: "관련도순" },
];

// ─── Render pills ───
function renderPills(container, items, activeId, onClick) {
  const el = document.getElementById(container);
  el.innerHTML = "";
  items.forEach(item => {
    const btn = document.createElement("button");
    btn.className = "pill" + (item.id === activeId ? " active" : "");
    btn.textContent = item.label;
    btn.onclick = () => {
      onClick(item.id);
      el.querySelectorAll(".pill").forEach((p, i) =>
        p.classList.toggle("active", items[i].id === item.id)
      );
    };
    el.appendChild(btn);
  });
}

renderPills("catPills", CATEGORIES, "0", id => selectedCat = id);
renderPills("timePills", TIME_RANGES, "24h", id => selectedTime = id);
renderPills("orderPills", ORDERS, "viewCount", id => selectedOrder = id);

// ─── Mode switch ───
function switchMode(m) {
  mode = m;
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.dataset.mode === m)
  );
  document.getElementById("popularFilters").style.display = m === "popular" ? "flex" : "none";
  const sf = document.getElementById("shortsFilters");
  sf.classList.toggle("visible", m === "shorts");
}

// ─── Helpers ───
function fmt(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
}
function timeAgo(dateStr) {
  const h = Math.floor((Date.now() - new Date(dateStr).getTime()) / 36e5);
  if (h < 1) return "방금 전";
  if (h < 24) return h + "시간 전";
  return Math.floor(h / 24) + "일 전";
}
function parseDuration(iso) {
  if (!iso) return -1;
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!m || (!m[1] && !m[2] && !m[3])) return -1;
  return (parseInt(m[1]||0)*3600) + (parseInt(m[2]||0)*60) + parseInt(m[3]||0);
}
function fmtDuration(sec) {
  if (sec < 0) return "?:??";
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m > 0 ? m + ":" + String(s).padStart(2,"0") : "0:" + String(s).padStart(2,"0");
}
function escHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}
function getPublishedAfter(range) {
  const now = new Date();
  const map = { "6h": 6, "24h": 24, "48h": 48, "7d": 168 };
  now.setHours(now.getHours() - (map[range] || 24));
  return now.toISOString();
}

// ─── Enter key ───
document.getElementById("apiKey").addEventListener("keydown", e => {
  if (e.key === "Enter") doFetch();
});
document.getElementById("searchQuery").addEventListener("keydown", e => {
  if (e.key === "Enter") doFetch();
});

// ─── Main fetch ───
async function doFetch() {
  const key = document.getElementById("apiKey").value.trim();
  const btn = document.getElementById("fetchBtn");
  const errBox = document.getElementById("errorBox");
  const countLabel = document.getElementById("countLabel");
  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("emptyState");
  const noteEl = document.getElementById("apiNote");

  errBox.style.display = "none";
  noteEl.style.display = "none";
  countLabel.style.display = "none";
  listEl.innerHTML = "";
  emptyEl.style.display = "none";

  if (!key) {
    errBox.textContent = "API 키를 입력해주세요.";
    errBox.style.display = "block";
    return;
  }

  btn.disabled = true;
  btn.textContent = "수집 중…";

  try {
    let videos;
    if (mode === "popular") {
      videos = await fetchPopular(key);
    } else {
      videos = await fetchShorts(key);
    }

    if (videos.length === 0) {
      emptyEl.textContent = "결과가 없습니다.";
      emptyEl.style.display = "block";
    } else {
      countLabel.textContent = videos.length + "개 영상 수집 완료";
      countLabel.style.display = "block";
      renderList(videos, listEl);
    }
  } catch (e) {
    if (e.message.startsWith("API:")) {
      errBox.textContent = e.message;
    } else {
      errBox.textContent = "요청 실패: " + e.message;
    }
    errBox.style.display = "block";
  }

  btn.disabled = false;
  btn.textContent = "수집하기";
}

// ─── mostPopular ───
async function fetchPopular(key) {
  const params = new URLSearchParams({
    part: "snippet,statistics,contentDetails",
    chart: "mostPopular",
    regionCode: "KR",
    maxResults: "50",
    key: key,
  });
  if (selectedCat !== "0") params.set("videoCategoryId", selectedCat);

  const res = await fetch("https://www.googleapis.com/youtube/v3/videos?" + params);
  const data = await res.json();
  if (data.error) throw new Error("API: " + data.error.message);

  return (data.items || []).map(item => ({
    id: item.id,
    title: item.snippet.title,
    channel: item.snippet.channelTitle,
    thumb: (item.snippet.thumbnails.high || item.snippet.thumbnails.medium || {}).url || "",
    views: Number(item.statistics.viewCount || 0),
    likes: Number(item.statistics.likeCount || 0),
    published: item.snippet.publishedAt,
    durationSec: parseDuration(item.contentDetails?.duration),
  }));
}

// ─── Search → Shorts ───
async function fetchShorts(key) {
  const q = document.getElementById("searchQuery").value.trim();
  const noteEl = document.getElementById("apiNote");

  // 검색어에 #shorts 자동 부착
  const shortsQuery = q ? q + " #shorts" : "#shorts";

  // Step 1: search.list
  const sp = new URLSearchParams({
    part: "snippet",
    type: "video",
    videoDuration: "short",
    order: selectedOrder,
    regionCode: "KR",
    publishedAfter: getPublishedAfter(selectedTime),
    maxResults: "50",
    q: shortsQuery,
    key: key,
  });

  const sRes = await fetch("https://www.googleapis.com/youtube/v3/search?" + sp);
  const sData = await sRes.json();
  if (sData.error) throw new Error("API: " + sData.error.message);

  const ids = (sData.items || []).map(i => i.id.videoId).filter(Boolean);
  if (ids.length === 0) return [];

  // Step 2: videos.list for stats + duration
  const vp = new URLSearchParams({
    part: "snippet,statistics,contentDetails",
    id: ids.join(","),
    key: key,
  });
  const vRes = await fetch("https://www.googleapis.com/youtube/v3/videos?" + vp);
  const vData = await vRes.json();
  if (vData.error) throw new Error("API: " + vData.error.message);

  const allVideos = (vData.items || []).map(item => ({
    id: item.id,
    title: item.snippet.title,
    channel: item.snippet.channelTitle,
    thumb: (item.snippet.thumbnails.high || item.snippet.thumbnails.medium || {}).url || "",
    views: Number(item.statistics.viewCount || 0),
    likes: Number(item.statistics.likeCount || 0),
    published: item.snippet.publishedAt,
    durationSec: parseDuration(item.contentDetails?.duration),
  }));

  // 디버그: 필터 전 영상 목록
  console.table(allVideos.map(v => ({
    title: v.title.slice(0, 30),
    duration: v.durationSec + "s",
    views: v.views,
  })));

  // 60초 이하만 필터 (실제 쇼츠), duration 파싱 실패(-1)는 제외
  const videos = allVideos.filter(v => v.durationSec > 0 && v.durationSec <= 60);
  console.log(`필터 결과: ${allVideos.length}건 → ${videos.length}건 (60초 이하)`);

  // 조회수순 재정렬
  if (selectedOrder === "viewCount") {
    videos.sort((a, b) => b.views - a.views);
  }

  // API 호출 정보 표시
  noteEl.innerHTML =
    '<code>search.list</code> q="' + escHtml(shortsQuery) + '", order=' + selectedOrder +
    ', ' + selectedTime +
    ' → ' + allVideos.length + '건 중 60초 이하 <strong>' + videos.length + '건</strong>';
  noteEl.style.display = "block";

  return videos;
}

// ─── Render ───
function renderList(videos, container) {
  videos.forEach((v, i) => {
    const rank = i + 1;
    const isShorts = v.durationSec <= 60;
    const url = isShorts
      ? "https://www.youtube.com/shorts/" + v.id
      : "https://www.youtube.com/watch?v=" + v.id;

    const a = document.createElement("a");
    a.className = "item";
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.innerHTML = `
      <div class="rank ${rank <= 3 ? 'top' : ''}">${rank}</div>
      <div class="thumb ${isShorts ? 'vertical' : ''}">
        <img src="${v.thumb}" alt="" loading="lazy">
      </div>
      <div class="info">
        <div class="title">${escHtml(v.title)}</div>
        <div class="channel">${escHtml(v.channel)}</div>
        <div class="stats">
          <span>조회 ${fmt(v.views)}</span>
          <span>좋아요 ${fmt(v.likes)}</span>
          <span>${timeAgo(v.published)}</span>
        </div>
        <div class="badge-row">
          <span class="dur-badge ${isShorts ? 'shorts' : ''}">
            ${isShorts ? 'Shorts ' : ''}${fmtDuration(v.durationSec)}
          </span>
        </div>
      </div>
    `;
    container.appendChild(a);
  });
}
</script>

</body>
</html>
